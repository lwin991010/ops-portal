<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Construction Team Portal</title>
  
  <link rel="manifest" href="https://lwin991010.github.io/ops-portal/manifest.json?v=6">
  <link rel="icon" type="image/png" sizes="512x512" href="https://lwin991010.github.io/ops-portal/icon-512.png?v=6">
  <link rel="apple-touch-icon" sizes="512x512" href="https://lwin991010.github.io/ops-portal/icon-512.png?v=6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Team Portal">
  <meta name="theme-color" content="#1a73e8">

  <script>
    // Mobile URLs (<= 768px)
    const MOBILE_WEPL_URL = "https://ctd-portal.appsmith.com/app/construction-team-portal/mobile-submit-wepl-6aeafa6708bd09fa65dadae7";
    const MOBILE_SUPPLY_URL = "https://ctd-portal.appsmith.com/app/construction-team-portal/mobile-submit-supplylabor-6afd063b6bacc39eec6426fb";
    const MOBILE_SCHEDULE_URL = "https://ctd-portal.appsmith.com/app/construction-team-portal/mobile-manpower-schedule-6aebdd7508bd09fa65dae892";

    // Desktop URLs (> 768px)
    const DESKTOP_WEPL_URL = "https://ctd-portal.appsmith.com/app/construction-team-portal/submission-portal-wepl-69e980e20442754ac8a2bc4f";
    const DESKTOP_SUPPLY_URL = "https://ctd-portal.appsmith.com/app/construction-team-portal/submission-portal-supply-6afe5e3f1abc92d0f638f9bc";
    const DESKTOP_SCHEDULE_URL = "https://ctd-portal.appsmith.com/app/construction-team-portal/manpower-schedule-update-6afeae556e0d100ad1b3e2a8";

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('https://lwin991010.github.io/ops-portal/sw.js')
          .catch(err => console.error(err));
      });
    }

    function isDesktopScreen() {
      return window.innerWidth > 768;
    }

    function getTargetUrl(mobileUrl, desktopUrl) {
      return isDesktopScreen() ? desktopUrl : mobileUrl;
    }

    function openPortal(event, mobileUrl, desktopUrl) {
      const targetUrl = getTargetUrl(mobileUrl, desktopUrl);

      if (window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches) {
        event.preventDefault();
        window.location.href = targetUrl;
      } else if (isDesktopScreen()) {
        event.preventDefault();
        window.open(targetUrl, "_blank", "noopener,noreferrer");
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById("btn-wepl").href = getTargetUrl(MOBILE_WEPL_URL, DESKTOP_WEPL_URL);
      document.getElementById("btn-supply").href = getTargetUrl(MOBILE_SUPPLY_URL, DESKTOP_SUPPLY_URL);
      document.getElementById("btn-schedule").href = getTargetUrl(MOBILE_SCHEDULE_URL, DESKTOP_SCHEDULE_URL);
    });
  </script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f8fafc;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .card {
      background: white;
      padding: 32px 24px;
      border-radius: 20px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      max-width: 340px;
      width: 100%;
    }
    .logo {
      width: 100%;
      max-width: 280px;
      height: auto;
      display: block;
      margin: 0 auto 8px auto;
      object-fit: contain;
    }
    h2 {
      margin: 0 0 6px 0;
      color: #1e293b;
      font-size: 20px;
      font-weight: 700;
    }
    p {
      color: #64748b;
      font-size: 14px;
      margin: 0 0 24px 0;
      line-height: 1.4;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn {
      display: block;
      width: 100%;
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;
      padding: 15px 16px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      text-align: center;
      transition: background 0.15s ease, transform 0.1s ease;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .btn-primary {
      background-color: #2563eb;
      color: #ffffff !important;
      box-shadow: 0 4px 12px rgba(37,99,235,0.25);
    }
    .btn-supply {
      background-color: #0284c7;
      color: #ffffff !important;
      box-shadow: 0 4px 12px rgba(2,132,199,0.25);
    }
    .btn-secondary {
      background-color: #16a34a;
      color: #ffffff !important;
      box-shadow: 0 4px 12px rgba(22,163,74,0.25);
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="https://lwin991010.github.io/ops-portal/icon-512.png?v=6" alt="Company Logo" class="logo">
    <h2>Construction Team Portal</h2>
    <p>Select a portal to continue</p>
    
    <div class="actions">
      <!-- 1. WEPL Submission Portal -->
      <a 
        id="btn-wepl"
        class="btn btn-primary" 
        href="https://ctd-portal.appsmith.com/app/construction-team-portal/mobile-submit-wepl-6aeafa6708bd09fa65dadae7" 
        target="_blank" 
        rel="noopener noreferrer"
        onclick="openPortal(event, MOBILE_WEPL_URL, DESKTOP_WEPL_URL);"
      >
        👷 WEPL Worker Submission
      </a>

      <!-- 2. Supply Labor Submission Portal -->
      <a 
        id="btn-supply"
        class="btn btn-supply" 
        href="https://ctd-portal.appsmith.com/app/construction-team-portal/mobile-submit-supplylabor-6afd063b6bacc39eec6426fb" 
        target="_blank" 
        rel="noopener noreferrer"
        onclick="openPortal(event, MOBILE_SUPPLY_URL, DESKTOP_SUPPLY_URL);"
      >
        🤝 Supply Labor Submission
      </a>

      <!-- 3. Manpower Schedule Portal -->
      <a 
        id="btn-schedule"
        class="btn btn-secondary" 
        href="https://ctd-portal.appsmith.com/app/construction-team-portal/mobile-manpower-schedule-6aebdd7508bd09fa65dae892" 
        target="_blank" 
        rel="noopener noreferrer"
        onclick="openPortal(event, MOBILE_SCHEDULE_URL, DESKTOP_SCHEDULE_URL);"
      >
        📅 Manpower Schedule
      </a>
    </div>
  </div>
</body>
</html>
