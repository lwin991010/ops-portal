<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Operations</title>
  
  <link rel="manifest" href="https://lwin991010.github.io/ops-portal/manifest.json">
  <link rel="icon" type="image/png" sizes="512x512" href="https://lwin991010.github.io/ops-portal/logo.png">
  <link rel="apple-touch-icon" sizes="512x512" href="https://lwin991010.github.io/ops-portal/logo.png">
  <meta name="theme-color" content="#1a73e8">

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('https://lwin991010.github.io/ops-portal/sw.js')
          .catch(err => console.error(err));
      });
    }

    function openPortal() {
      const url = "https://ctd-portal.appsmith.com/app/team-operations-financials/mobile-submit-6aeafa6708bd09fa65dadae7";
      // Force navigation to external domain
      window.open(url, '_blank');
      window.location.href = url;
    }
  </script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f8fafc;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .card {
      background: white;
      padding: 32px 24px;
      border-radius: 20px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      max-width: 320px;
      width: 100%;
    }
    .logo {
      width: 100px;
      height: 100px;
      border-radius: 20px;
      margin-bottom: 16px;
      object-fit: contain;
    }
    h2 {
      margin: 0 0 8px 0;
      color: #1e293b;
      font-size: 22px;
      font-weight: 700;
    }
    p {
      color: #64748b;
      font-size: 14px;
      margin: 0 0 24px 0;
      line-height: 1.4;
    }
    .btn {
      display: block;
      width: 100%;
      background-color: #2563eb;
      color: #ffffff !important;
      text-decoration: none;
      font-size: 16px;
      font-weight: 600;
      padding: 16px;
      border-radius: 12px;
      border: none;
      box-shadow: 0 4px 12px rgba(37,99,235,0.3);
      cursor: pointer;
    }
    .btn:active {
      background-color: #1d4ed8;
      transform: scale(0.98);
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="https://lwin991010.github.io/ops-portal/logo.png" alt="Company Logo" class="logo">
    <h2>Team Operations</h2>
    <p>Field Submissions & Operations Portal</p>
    
    <!-- Real standard anchor link + javascript trigger for maximum mobile compatibility -->
    <a 
      class="btn" 
      href="https://ctd-portal.appsmith.com/app/team-operations-financials/mobile-submit-6aeafa6708bd09fa65dadae7" 
      target="_blank" 
      rel="noopener noreferrer"
      onclick="openPortal();"
    >
      Open Portal
    </a>
  </div>
</body>
</html>
