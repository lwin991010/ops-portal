<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Operations</title>
  
  <link rel="manifest" href="https://lwin991010.github.io/ops-portal/manifest.json">
  <link rel="icon" type="image/png" sizes="512x512" href="https://lwin991010.github.io/ops-portal/logo.png">
  <link rel="apple-touch-icon" sizes="512x512" href="https://lwin991010.github.io/ops-portal/logo.png">
  <meta name="theme-color" content="#1a73e8">

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('https://lwin991010.github.io/ops-portal/sw.js')
          .catch(err => console.error(err));
      });
    }

    function openLink(url) {
      window.open(url, '_blank');
      window.location.href = url;
    }
  </script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f8fafc;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .card {
      background: white;
      padding: 32px 24px;
      border-radius: 20px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      max-width: 330px;
      width: 100%;
    }
    .logo {
      width: 96px;
      height: 96px;
      border-radius: 20px;
      margin-bottom: 16px;
      object-fit: contain;
    }
    h2 {
      margin: 0 0 6px 0;
      color: #1e293b;
      font-size: 22px;
      font-weight: 700;
    }
    p {
      color: #64748b;
      font-size: 14px;
      margin: 0 0 24px 0;
      line-height: 1.4;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn {
      display: block;
      width: 100%;
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;
      padding: 15px 16px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      text-align: center;
      transition: background 0.15s ease, transform 0.1s ease;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .btn-primary {
      background-color: #2563eb;
      color: #ffffff !important;
      box-shadow: 0 4px 12px rgba(37,99,235,0.25);
    }
    .btn-secondary {
      background-color: #0f172a;
      color: #ffffff !important;
      box-shadow: 0 4px 12px rgba(15,23,42,0.2);
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="https://lwin991010.github.io/ops-portal/logo.png" alt="Company Logo" class="logo">
    <h2>Team Operations</h2>
    <p>Select a portal to continue</p>
    
    <div class="actions">
      <!-- Submission Portal -->
      <a 
        class="btn btn-primary" 
        href="https://ctd-portal.appsmith.com/app/team-operations-financials/mobile-submit-6aeafa6708bd09fa65dadae7" 
        target="_blank" 
        rel="noopener noreferrer"
        onclick="openLink('https://ctd-portal.appsmith.com/app/team-operations-financials/mobile-submit-6aeafa6708bd09fa65dadae7');"
      >
        📝 Field Submission Form
      </a>

      <!-- Manpower Schedule Portal -->
      <a 
        class="btn btn-secondary" 
        href="https://ctd-portal.appsmith.com/app/team-operations-financials/mobile-manpower-schedule-6aebdd7508bd09fa65dae892" 
        target="_blank" 
        rel="noopener noreferrer"
        onclick="openLink('https://ctd-portal.appsmith.com/app/team-operations-financials/mobile-manpower-schedule-6aebdd7508bd09fa65dae892');"
      >
        📅 Manpower Schedule
      </a>
    </div>
  </div>
</body>
</html>
